name: salesiq

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: salesiq
      POSTGRES_PASSWORD: salesiq
      POSTGRES_DB: salesiq
    ports:
      - "127.0.0.1:${SALESIQ_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesiq -d salesiq"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${SALESIQ_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # Runtime connects as the non-superuser app role so row-level security applies.
      SALESIQ_DATABASE_URL: postgresql+psycopg://salesiq_app:salesiq_app@postgres:5432/salesiq
      SALESIQ_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${SALESIQ_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

  # Schema changes, as a one-off job: `docker compose run --rm migrate`. Only this holds the owner
  # URL, so a compromised API or worker has no route to it.
  migrate:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    command: [".venv/bin/alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    environment:
      SALESIQ_MIGRATION_DATABASE_URL: postgresql+psycopg://salesiq:salesiq@postgres:5432/salesiq
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["migrate"]

  # For outside MCP clients. Every request needs a token; see docs/DEPLOYMENT.md.
  mcp:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    command: [".venv/bin/python", "-m", "app.mcp.http"]
    healthcheck:
      disable: true
    environment:
      SALESIQ_DATABASE_URL: postgresql+psycopg://salesiq_app:salesiq_app@postgres:5432/salesiq
      SALESIQ_REDIS_URL: redis://redis:6379/0
      SALESIQ_MCP_HOST: 0.0.0.0
      SALESIQ_MCP_PUBLIC_URL: http://localhost:8100
    ports:
      - "127.0.0.1:${SALESIQ_MCP_PORT:-8100}:8100"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

  # Runs workflows and large imports. Scale it freely: claims are atomic, and a run from a worker
  # that dies is recovered by another once its lease expires.
  worker:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    command: [".venv/bin/python", "-m", "app.tasks.worker"]
    restart: unless-stopped
    # The image's healthcheck is the API's HTTP probe, and a worker serves no HTTP.
    healthcheck:
      disable: true
    env_file:
      - path: .env
        required: false
    environment:
      SALESIQ_DATABASE_URL: postgresql+psycopg://salesiq_app:salesiq_app@postgres:5432/salesiq
      SALESIQ_WORKER_DATABASE_URL: postgresql+psycopg://salesiq_worker:salesiq_worker@postgres:5432/salesiq
      SALESIQ_REDIS_URL: redis://redis:6379/0
      # Inside a container, 127.0.0.1 is the container. Ollama usually runs on the host.
      SALESIQ_OLLAMA_BASE_URL: ${SALESIQ_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      SALESIQ_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${SALESIQ_WEB_PORT:-3000}:3000"
    depends_on:
      - api
    profiles: ["app"]

volumes:
  pgdata:
