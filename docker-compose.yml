name: salesiq

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: salesiq
      POSTGRES_PASSWORD: salesiq
      POSTGRES_DB: salesiq
    ports:
      - "127.0.0.1:${SALESIQ_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesiq -d salesiq"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${SALESIQ_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      SALESIQ_DATABASE_URL: postgresql+psycopg://salesiq:salesiq@postgres:5432/salesiq
      SALESIQ_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      SALESIQ_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    profiles: ["app"]

volumes:
  pgdata:
