[project]
name = "salesiq-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp<3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy>=2",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyter-client>=8.10.0",
    "mypy>=2.4.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
# Prompt text and stop-word lists read better unwrapped.
"app/agents/evaluation/tasks.py" = ["E501"]
"app/agents/evaluation/metrics.py" = ["E501"]
"app/agents/evaluation/baseline.py" = ["E501"]
"app/agents/evaluation/runner.py" = ["E501"]
"app/agents/evaluation/report.py" = ["E501"]
"app/agents/evaluation/gate_eval.py" = ["E501"]
"app/agents/evaluation/agent_eval.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
